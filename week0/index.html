<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹페이지</title>
    <style>
        .card {
            width: 100%;
            max-width: 560px;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
        }   

        .card h1 {
            color: #222222;
        }

        .card p {
            color: #666666;
        }

        .card ul {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
            padding: 0;
        }

        .card li {
            padding: 4px 10px;
            background-color: #f2f2f2;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background-color: #4a90d9;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #357abd;
        }
    </style>    
</head>
<body>
    <div class="card">
        <h1>김유겸</h1> 
        <p>안녕하세요. 중앙대 소프트웨어학부 23학번 김유겸입니다.</p>
        <main>
            <section>
                <h2>배우고 싶은 기술</h2>
                    <ul>
                        <li>HTML</li>
                        <li>CSS</li>
                        <li>JavaScript</li>
                    </ul>
            </section>
        </main>
        <a href="https://github.com/6ye0m">나의 깃허브</a>
        <button type="button">인사하기</button>
    </div>
</body>
</html>
